name: User story
description: A product backlog item written from the user's point of view
title: "US-XX: "
labels: [user-story]
body:
  - type: textarea
    id: story
    attributes:
      label: User story
      description: As a <role>, I want <goal>, so that <benefit>.
      placeholder: As a professor, I want ..., so that ...
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Testable conditions the Product Owner checks at the sprint review.
      placeholder: |
        - [ ] Given ..., when ..., then ...
        - [ ] ...
    validations:
      required: true
  - type: dropdown
    id: points
    attributes:
      label: Story points (planning poker)
      options: ["1", "2", "3", "5", "8", "13 — too big, split it"]
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options: [High, Medium, Low]
    validations:
      required: true
  - type: textarea
    id: tasks
    attributes:
      label: Tasks
      description: Filled in at sprint planning.
      placeholder: |
        - [ ] Backend:
        - [ ] Web UI:
        - [ ] Tests:
        - [ ] Docs:
