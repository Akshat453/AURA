# Continuous Delivery.
#
#   push to main  -> run the full CI suite -> publish the Docker image to
#                    GitHub Container Registry (ghcr.io) tagged `main`,
#                    `sha-<commit>` and `latest` -> deploy it to the
#                    `staging` environment and verify it there.
#   push tag v*   -> the same, tagged with the version, and additionally a
#                    GitHub Release with the backend package (Node.js
#                    sources + lockfile, scripts, docs) plus SHA-256 checksums.
#
# Every sprint review demos the increment this workflow produced.
name: CD

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false # never cancel a half-finished release

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  publish-image:
    name: Publish image to GHCR
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.name.outputs.image }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
      - name: Image name (registry names must be lower-case)
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=ref,event=branch
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build and push (linux/amd64, linux/arm64)
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Summary
        run: |
          {
            echo "### Published image"
            echo ""
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo "Digest: \`${{ steps.push.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-staging:
    name: Deploy to staging and verify
    needs: publish-image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull the exact image that was published
        run: |
          ref="${{ needs.publish-image.outputs.image }}@${{ needs.publish-image.outputs.digest }}"
          docker pull "$ref"
          echo "REF=$ref" >> "$GITHUB_ENV"
      - name: Deploy and run post-deployment checks
        run: bash scripts/ci/smoke-test.sh --docker "$REF"
      - name: Summary
        run: |
          {
            echo "### Staging deployment verified"
            echo ""
            echo "Image \`$REF\` started, answered /healthz and served the web UI."
            echo ""
            echo "Run it locally: \`docker run --rm -p 127.0.0.1:8090:8090 -e GEMINI_API_KEY=... ${{ needs.publish-image.outputs.image }}:latest\`"
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ci, deploy-staging]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Download build artifacts from CI
        uses: actions/download-artifact@v8
        with:
          pattern: build-*
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          sha256sum -- *.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/*.tar.gz dist/SHA256SUMS.txt \
            --title "Professor Voice Assistant $TAG" \
            --generate-notes \
            --verify-tag
